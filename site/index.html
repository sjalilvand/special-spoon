<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <!-- فاز ۷۹: viewport-fit=cover برای گوشی‌های ناچ‌دار (حالت standalone PWA) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- فاز ۷۹: متای PWA در سورس — با هر rebuild خودکار حاضر است (اسکریپت فقط fallback است) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/app-icon-192.png" />
    <link rel="apple-touch-icon" href="/app-icon-192.png" />
    <meta name="theme-color" content="#7c2740" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="رزپسی" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="کلینیک مشاوره و روان‌درمانی رزپسی — روان‌درمانی، مشاوره فردی و گروهی با تیمی از مشاوران متخصص، در محیطی امن و محرمانه." />
    <title>رزپسی | کلینیک مشاوره و روان‌درمانی</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // ورود یکپارچه (SSO) با رز هاب: توکن موقت ?sso_token= که رز هاب به همین
      // نشانی (ریشهٔ سایت) برمی‌گرداند، قبل از بوت برنامه به بک‌اند منتقل
      // می‌شود؛ بک‌اند نشست را برقرار می‌کند و به پنل سامانه هدایت می‌کند
      // و پارامتر sso_token از نشانی پاک می‌شود (ماندن توکن در history ممنوع).
      (function () {
        try {
          var q = new URLSearchParams(window.location.search);
          var t = q.get("sso_token");
          if (t) {
            window.location.replace(
              "/api/v1/auth/rose-sso?sso_token=" + encodeURIComponent(t)
            );
          }
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // فاز ۸۰: ثبت سرویس‌ورکر PWA — کش آفلاین و سرعت بارهای بعدی روی موبایل.
      // بعد از رویداد load ثبت می‌شود تا با رندر اول رقابت نکند؛ هر شکستی بی‌صدا نادیده گرفته می‌شود.
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {});
        });
      }
    </script>
  </body>
</html>
