name: rosepsy

services:
  db:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # بند ۱۳.۲: PostgreSQL در عملیات پورت عمومی ندارد

  # فاز ۲۷ - B39-plus: آنتی‌ویروس واقعی ClamAV (فقط شبکه داخلی؛ پورت عمومی ندارد)
  clamav:
    image: clamav/clamav:1.4.2
    restart: unless-stopped
    environment:
      # سقف INSTREAM بالاتر از سقف آپلود (MAX_UPLOAD_MB)
      CLAMD_CONF_StreamMaxLength: 100M
    volumes:
      - clamav_data:/var/lib/clamav

  # فاز ۳۸ - گام ۱ طرح مهاجرت ADR-04: Object Storage سازگار S3 (MinIO)
  # پروفایل storage: فقط با «docker compose --profile storage up -d» بالا می‌آید
  # تا در استقرار پیش‌فرض local سربار اضافه نباشد؛ آداپتور fail-soft است و
  # نبود این سرویس هیچ مسیر API را نمی‌شکند (fallback به local).
  # بند ۱۳.۲: MinIO در عملیات پورت عمومی ندارد — فقط شبکه داخلی Docker.
  # کلیدها از .env (MINIO_ROOT_USER / MINIO_ROOT_PASSWORD) می‌آیند و هرگز
  # به کلاینت/لاگ/پاسخ API نمی‌روند (قرارداد ADR-04).
  minio:
    image: minio/minio:RELEASE.2025-10-15T17-29-55Z
    profiles: ["storage"]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-rosepsy}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-CHANGE_ME_STRONG_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ساخت bucket یک‌باره (idempotent) — پس از سالم‌شدن MinIO اجرا می‌شود؛
  # نسخه‌گذاری bucket فعال می‌شود (پیش‌نیاز lifecycle/بازیابی ADR-04).
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    profiles: ["storage"]
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_BUCKET: ${S3_BUCKET:-rosepsy-files}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-rosepsy}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-CHANGE_ME_STRONG_PASSWORD}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$S3_BUCKET &&
      mc version enable local/$$S3_BUCKET || true &&
      echo 'MinIO bucket ready'"

  api:
    build: ./backend
    image: rosepsy/api:0.21.0
    restart: unless-stopped
    env_file: .env
    environment:
      CLAMAV_HOST: clamav
      # فاز ۴۰ - گام ۳ طرح ADR-04: سوییچ به s3 — نبود کلیدها/سرویس → fallback
      # شفاف به local (سپر خرابی)؛ بازگشت کامل با STORAGE_BACKEND=local در .env
      STORAGE_BACKEND: ${STORAGE_BACKEND:-s3}
      # آدرس داخلی MinIO (فقط وقتی STORAGE_BACKEND=s3 باشد استفاده می‌شود؛
      # در حالت local بی‌اثر است). کلیدها از .env می‌آیند.
      S3_ENDPOINT_URL: http://minio:9000
    volumes:
      - private_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      clamav:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # بند ۱۳.۲: API فقط از شبکه داخلی Docker توسط Nginx در دسترس است

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: rosepsy/web:0.21.0
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api

  migrate:
    build: ./backend
    env_file: .env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    # بند ۱۳.۲: Migration توسط یک Job یک‌باره اجرا می‌شود

  backup:
    image: postgres:16.4-alpine
    profiles: ["ops"]
    env_file: .env
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
      - ./deploy/backup.sh:/backup.sh:ro
    entrypoint: ["sh", "/backup.sh"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

volumes:
  postgres_data:
  private_uploads:
  clamav_data:
  # فاز ۳۸ - ADR-04: volume اختصاصی Object Storage
  minio_data:
