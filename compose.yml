name: rosepsy

services:
  db:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # بند ۱۳.۲: PostgreSQL در عملیات پورت عمومی ندارد

  api:
    build: ./backend
    image: rosepsy/api:0.1.0
    restart: unless-stopped
    env_file: .env
    volumes:
      - private_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # بند ۱۳.۲: API فقط از شبکه داخلی Docker توسط Nginx در دسترس است

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: rosepsy/web:0.1.0
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api

  migrate:
    build: ./backend
    env_file: .env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    # بند ۱۳.۲: Migration توسط یک Job یک‌باره اجرا می‌شود

  backup:
    image: postgres:16.4-alpine
    profiles: ["ops"]
    env_file: .env
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
      - ./deploy/backup.sh:/backup.sh:ro
    entrypoint: ["sh", "/backup.sh"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

volumes:
  postgres_data:
  private_uploads:
