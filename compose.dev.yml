name: rosepsy-dev

services:
  # فاز ۴۳ - ADR-05: Redis سقف نرخ در توسعه (پورت ۶۳۷۹ برای دیدن شمارنده‌ها)
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
  db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # فاز ۳۸ - گام ۱ طرح مهاجرت ADR-04: MinIO در توسعه با پورت باز (۹۰۰۰/۹۰۰۱)
  # کنسول: http://localhost:9001 — آداپتور backend فقط با STORAGE_BACKEND=s3 فعال می‌شود
  # تصویر رسمی minio/minio از Docker Hub حذف شد → alpine/minio با همان تگ RELEASE؛
  # user root + healthcheck wget (تصویر alpine/minio نه mc دارد و نه root است)
  minio:
    image: alpine/minio:RELEASE.2025-10-15T17-29-55Z
    user: "0:0"
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-rosepsy}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_dev_pass}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_dev_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9000/minio/health/ready >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio-init:
    image: rancher/mirrored-minio-mc:RELEASE.2023-06-28T21-54-17Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_BUCKET: ${S3_BUCKET:-rosepsy-files}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-rosepsy}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_dev_pass}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$S3_BUCKET &&
      mc version enable local/$$S3_BUCKET || true &&
      echo 'MinIO bucket ready (dev)'"

  api:
    build: ./backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      S3_ENDPOINT_URL: http://minio:9000
      # فاز ۴۱ - ADR-03 گام ۴: انقضای اعلام‌شده v1 (هدرهای Deprecation/Sunset روی v1)
      V1_DEPRECATION_MODE: ${V1_DEPRECATION_MODE:-warn}
      V1_SUNSET_DATE: ${V1_SUNSET_DATE:-2027-04-20}
      # فاز ۴۳ - گام‌های ۱–۲ طرح ADR-05: سقف نرخ سراسری Redis
      RATE_LIMIT_REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
      - ./backend/uploads_dev:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  postgres_dev_data:
  # فاز ۳۸ - ADR-04: volume اختصاصی Object Storage (توسعه)
  minio_dev_data:
  # فاز ۴۳ - ADR-05: شمارنده‌های سقف نرخ (توسعه)
  redis_dev_data:
