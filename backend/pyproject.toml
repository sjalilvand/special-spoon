[project]
name = "rosepsy-backend"
version = "0.21.0"
description = "Rosepsy - سامانه مشاوره روان‌شناختی سازمانی"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "SQLAlchemy==2.0.36",
    "psycopg[binary]==3.2.3",
    "alembic==1.14.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "argon2-cffi==23.1.0",
    "PyJWT==2.10.1",
    "openpyxl==3.1.5",
    "python-multipart==0.0.20",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "httpx==0.28.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
