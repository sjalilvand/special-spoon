<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <!-- فاز ۸۱: viewport-fit=cover برای گوشی‌های ناچ‌دار (حالت standalone PWA) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- فاز ۸۱: متای PWA پنل — نصب مستقل با start_url روی /panel/ -->
    <link rel="manifest" href="/panel/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/app-icon-192.png" />
    <link rel="apple-touch-icon" href="/app-icon-192.png" />
    <meta name="theme-color" content="#7c2740" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="پنل رزپسی" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Rosepsy | سامانه مشاوره روان‌شناختی سازمانی</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // ورود یکپارچه (SSO) با رز هاب: اگر توکن موقت در URL باشد، قبل از بوت
      // برنامه به بک‌اند منتقل می‌شود تا نشست از طریق کوکی refresh برقرار شود
      // و پارامتر sso_token از نشانی پاک شود (نگه‌داشتن توکن در history ممنوع).
      (function () {
        try {
          var q = new URLSearchParams(window.location.search);
          var t = q.get("sso_token");
          if (t) {
            window.location.replace(
              "/api/v1/auth/rose-sso?sso_token=" + encodeURIComponent(t)
            );
          }
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // فاز ۸۱: ثبت سرویس‌ورکر سراسری (/sw.js از سایت، اسکوپ ریشه) برای پنل هم —
      // کش آفلاین و سرعت بارهای بعدی روی موبایل. روی HTTP بی‌صدا رد می‌شود (بدون خطا)
      // و با روشن‌شدن HTTPS خودکار فعال می‌گردد.
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {});
        });
      }
    </script>
  </body>
</html>
